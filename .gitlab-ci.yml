stages:
  - build-env
  - test
  - accept-package
  - build-binaries
  - package-installers
  - junie-review
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "internal-dev"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
build-image:
  image: docker:latest
  stage: build-env
  script:
    - docker build -t ausma-ai-build:linux -f backend/Dockerfile .
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "internal-dev"'
test-python:
  stage: test
  tags:
    - has-custom-docker
  image:
    name: ausma-ai-build:linux
    pull_policy: never
  cache:
    - key:
        files:
          - backend/requirements.txt
      paths:
        - backend/.venv/
  rules:
    - if: '$CI_COMMIT_BRANCH == "internal-dev"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
  script:
    - cd backend
    - echo "Running LLMs on '$TEST_OLLAMA_HOST'"
    - ./setup_python_linux.sh
    - ./run_tests_coverage.sh
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - backend/htmlcov/
      - backend/coverage.xml
      - backend/unit-tests.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
      junit: backend/unit-tests.xml
test-javascript:
  image: node:24-alpine
  stage: test
  cache:
    - key:
        files:
          - frontend/package.json
      paths:
        - frontend/node_modules/
        - frontend/package-lock.json
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - frontend/coverage/
      - frontend/junit.xml
    when: always
    reports:
      junit:
        - frontend/junit.xml
# audit checks for security vulnerabilities
# they should register as warnings and not fail builds during development
audit-javascript-frontend:
  image: node:24-alpine
  stage: test
  script:
    - cd frontend
    - npm audit
  allow_failure:
    exit_codes:
      - 1
audit-javascript-electron:
  image: node:24-alpine
  stage: test
  script:
    - cd electron-vite
    - npm audit
  allow_failure:
    exit_codes:
      - 1
audit-python:
  image: python:3.12
  stage: test
  script:
    - cd backend
    - python -m pip install pip-audit
    # ChromaDB
    # IGNORE: PYSEC-2026-311. If you set the embedding model in ChromaDB to a malicious one, you can preform RCE.
    # We use local chromaDB, therefore you would have to have local filesystem access to perform this.
    # IGNORE: PYSEC-2026-3813. If you are authentificated to Chroma you can access data for any other tenants.
    # We are not using tenants, it is effectively running single tenant mode.
    # IGNORE: PYSEC-2026-3814. Calling the ChromaDB HTTP API allows RCE.
    # We use local chromaDB, therefore no API is exposed.
    # IGNORE: PYSEC-2026-3815.  ChromaDB's SimpleRBACAuthorizationProvider does not permissions w.r.t. tenant, collection and database.
    # We are not using tenants. We run Chroma in local model, therefore all the database have the same permissions, i.e. all.
    # ChromaDB ends
    - IGNORES="--ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815"
    - pip-audit -r requirements.txt -r requirements_linux.txt $IGNORES
    - pip-audit -r requirements.txt  -r requirements_windows.txt $IGNORES
    - pip-audit -r requirements-build.txt
  allow_failure:
    exit_codes:
      - 1
# audit end
accept-package:
  stage: accept-package
  when: manual
  script:
    - echo "Manual build triggered"
package-frontend:
  image: node:24-alpine
  stage: build-binaries
  needs: 
    - accept-package
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    when: on_success
    paths:
      - frontend/dist/
package-backend-linux:
  image: python:3.12
  stage: build-binaries
  needs: 
    - accept-package
  before_script:
    - cd backend
  script:
    - ./build_bundled.sh
  after_script:
    - cd backend
    - du -s dist
    - du -hs dist
  artifacts:
    when: on_success
    paths:
      - backend/dist/
package-backend-windows:
  image: tobix/pywine:3.12
  stage: build-binaries
  needs: 
    - accept-package
  before_script:
    - pwd
    - ls -lahi
    - cd backend
    # image has python under C:\Python
    - wine reg add "HKCU\Environment" /v PATH /t REG_SZ /d "C:\Python;%PATH%" /f
  script:
    - wine cmd /C ./build_bundled.bat
  after_script:
    - cd backend
    - du -s dist
    - du -hs dist
  artifacts:
    when: on_success
    paths:
      - backend/dist/
package-electron-linux:
  image: node:24-trixie
  stage: package-installers
  needs:
    - package-backend-linux
    - package-frontend
  before_script:
    - cd electron-vite
    - npm ci
  script:
    - npm run build:linux
  after_script:
    - cd electron-vite
    - du -s dist
    - du -hs
  artifacts:
    when: on_success
    paths:
      - electron-vite/dist/
package-electron-windows:
  image: node:24-trixie
  stage: package-installers
  needs:
    - package-backend-windows
    - package-frontend
  before_script:
    - cd electron-vite
    - npm ci
  script:
    - npm run build:windows
  after_script:
    - cd electron-vite
    - du -s dist
    - du -hs
  artifacts:
    when: on_success
    paths:
      - electron-vite/dist/
junie-run:
  stage: test
  image:
    name: sbx/junie:latest
    entrypoint: [""]
  before_script:
    - echo "Preparing junie model config"
    - '[ -n "$LOCAL_OLLAMA_CONFIG" ] && printf "%s" "$LOCAL_OLLAMA_CONFIG" > .junie/models/local-ollama.json'
    - mkdir -p ~/.junie/models
    - cp .junie/models/* ~/.junie/models
    - echo "Current project - $CI_PROJECT_PATH"
    # - git config --global --add safe.directory /builds/$CI_PROJECT_PATH
  script:
    - echo "Will running config $LOCAL_OLLAMA_CONFIG"
    - echo "Will compare $CI_DEFAULT_BRANCH to $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - junie --verbose --model "custom:local-ollama" "Compare the current branch ($CI_MERGE_REQUEST_SOURCE_BRANCH_NAME) against the main branch ($CI_DEFAULT_BRANCH) and do a code review. Give a list of found problems, suggestions and improvements and where in the code they are located by line number, class, method etc. Output this all to a file named code_review.md ."
    - '(echo "<details>"; echo "<summary>Click to view report</summary>"; echo; cat code_review.md; echo; echo "</details>") > code_review_wrapped.md'
    - echo "Responding with code review to $CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_ID/notes"
    - 'curl --fail-with-body --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN_FOR_JUNIE" --data-urlencode "body@code_review_wrapped.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"'
  artifacts:
    paths:
      - code_review.md
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"