appId: ai.ausma
productName: ausma-ai
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
win:
  target:
    - msi
  icon: build/icon.ico

  extraResources:
    - from: '../backend/dist'
      to: '.'

    - from: '../backend/defaults.conf'
      to: 'flask_app/defaults.conf'

    - from: '../backend/bin/windows/pdftopng.exe'
      to: 'flask_app/bin/windows/pdftopng.exe'

    - from: '../frontend/dist'
      to: 'frontend'

    - from: 'build/icon.png'
      to: 'icon.png'
msi:
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: "ausma.ai"
  shortcutName: "ausma.ai"
  runAfterFinish: false
  oneClick: false
  perMachine: true
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  executableArgs:
  - "--no-sandbox"
  icon: build/icon
  extraResources:
    - from: '../backend/dist'
      to: '.'
    - from: '../backend/defaults.conf'
      to: 'flask_app/defaults.conf'
    - from: '../backend/bin/linux/pdftopng'
      to: 'flask_app/bin/linux/pdftopng'
    - from: '../frontend/dist'
      to: 'frontend'
    - from: 'build/icon.png'
      to: 'icon.png'
deb:
  depends:
    - python3.12-venv
    - poppler-utils
    - tesseract-ocr
    - libtesseract-dev
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
