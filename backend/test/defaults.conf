{
  "default_llm_runner": {
      "active": true,
      "type": "ollama",
      "name": "local_ollama",
      "host": "http://localhost:11434",
      "seed": 42,
      "num_predict": 8000,
      "num_ctx": 16000
  },
  "default_kbstore": {
        "store_type": "chroma",
        "name": "chroma_store",
        "kb_store_folder": "knowledge_bases/chroma"
  },
  "default_doc_sources": [],
  "default_knowledge_base": {
      "name": "all documents",
      "selection": ["**/*"],
      "convertors": [
        {
          "conversion": "raw"
        }
      ],
      "embedding":
        {
          "model": "bge-m3:latest"
        }
  },
  "room_defaults":
  {
    "model": "qwen2.5:latest",
    "knowledge_base": null
  },
  "generation_guard": {
      "safe_token_threshold": 5000,
      "token_check_interval": 100,
      "max_repeats": 5,
      "window_size": 50
  },
  "default_assistants": [
      {
          "name": "Ausma",
          "options": {
              "seed": 42,
              "num_predict": 8000,
              "num_ctx": 16000
          },
          "model": "gemma4:latest",
          "system_prompt": "You are a helpful assistant. Provide a conversational answer. Do not respond with anything that might cause XSS. If you don't know the answer, just say \"I do not know.\" Don't make up an answer. ",
          "runner_type": "ollama",
          "history_mode": "full"
      },
      {
          "name": "Astra",
          "options": {
              "seed": 42,
              "num_predict": 8000,
              "num_ctx": 16000
          },
          "model": "qwen3-vl:latest",
          "system_prompt": "You are a helpful assistant. Provide a conversational answer. Do not respond with anything that might cause XSS. If you don't know the answer, just say \"I do not know.\" Don't make up an answer. ",
          "runner_type": "ollama",
          "history_mode": "full"
      }
  ]
}